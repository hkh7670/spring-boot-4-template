spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:template;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 인메모리 DB라 기동할 때마다 엔티티 기준으로 테이블을 새로 만든다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
